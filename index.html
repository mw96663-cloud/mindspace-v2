
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mindspace｜心智小宇宙 V2</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<style>
:root{--ink:#26354f;--blue:#628fc2;--light:#f4f8ff;--line:#d8e5f3}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#dcecff}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:#e8f1fc;color:#25456b}
button:hover{filter:brightness(.96)}
button:disabled{opacity:.55;cursor:wait}
button.primary{background:#568ac5;color:white}
button.danger{background:#ffe6e8;color:#a13d49}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:white;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
h1,h2,h3,p{margin:0}
h3{font-size:15px;margin-bottom:10px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 345px;height:100dvh;overflow:hidden}
#world{position:relative;overflow:hidden;background:linear-gradient(#7bd3ec,#16649d);min-width:0}
#scene{position:absolute;inset:0;z-index:1}
#actors{position:absolute;inset:0;z-index:3;pointer-events:none}
.hero{position:absolute;width:145px;height:145px;object-fit:contain;pointer-events:auto;cursor:pointer;user-select:none;filter:drop-shadow(0 12px 9px #1235);transition:filter .2s}
.hero.selected{filter:drop-shadow(0 0 15px #ffe58a)}
#worldTitle{position:absolute;z-index:5;left:22px;top:22px;color:white;text-shadow:0 2px 9px #173e71;font-size:21px;font-weight:800}
#speechBubble{position:absolute;z-index:7;left:50%;top:17%;transform:translateX(-50%);max-width:min(80%,500px);padding:14px 20px;border-radius:22px;background:#fffffff0;color:#294466;box-shadow:0 8px 30px #17354c33;display:none;text-align:center;pointer-events:none}
#sidebar{background:#f8fbff;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:15px;border-left:1px solid #cddfec}
.panel{padding:15px;background:white;border:1px solid #e0eaf5;border-radius:18px;box-shadow:0 5px 20px #6d8cb00b}
.stack{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:#718198}
#heroList{display:flex;flex-wrap:wrap;gap:8px}
.hero-chip{display:flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid #d9e5f3;border-radius:14px;cursor:pointer;background:#f5f9ff}
.hero-chip.active{outline:2px solid #6b9ed7}
.hero-chip img{width:36px;height:36px;object-fit:contain}
#chatLog{height:145px;overflow:auto;background:#f4f8fe;padding:10px;border-radius:12px;font-size:13px;line-height:1.6}
.msg{margin:5px 0}.msg.user{text-align:right;color:#346da4}.msg.ai{color:#5e478f}
#status{font-size:12px;color:#59728d;min-height:19px;line-height:1.5}
#startScreen{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#163e80dd,#1b8db4b8);color:white;text-align:center}
#startScreen .intro{max-width:440px;padding:30px}
#startScreen h1{font-size:34px;margin-bottom:18px}
#startScreen p{line-height:1.9;margin-bottom:25px}
#startButton{font-size:19px;padding:15px 35px;background:#fff;color:#34689e}
#mobileToggle{display:none;position:absolute;z-index:9;right:15px;top:15px}
.modal{position:fixed;z-index:40;inset:0;background:#102846c9;display:none;align-items:center;justify-content:center;padding:15px}
.modal.open{display:flex}
.modal-content{background:white;border-radius:20px;padding:18px;width:min(95vw,790px);max-height:95dvh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#cameraVideo{display:block;width:100%;max-height:55dvh;background:#12283f;object-fit:contain;border-radius:12px}
#editCanvas{display:block;max-width:100%;max-height:48dvh;margin:auto;background-color:#fff;background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;touch-action:none}
#editorStatus{font-size:12px;color:#557391;min-height:18px}
#bridgeFrame{display:none}
@media(max-width:800px){
 #app{display:block;height:100dvh}
 #world{height:100dvh}
 #sidebar{position:fixed;z-index:12;right:0;top:0;bottom:0;width:min(90vw,355px);transform:translateX(102%);transition:transform .25s}
 #sidebar.open{transform:translateX(0)}
 #mobileToggle{display:block}
 #worldTitle{font-size:17px;max-width:75%}
 .hero{width:115px;height:115px}
}
</style>
</head>
<body>
<div id="app">
  <main id="world">
    <div id="scene"></div>
    <div id="actors"></div>
    <div id="worldTitle">Mindspace｜心智小宇宙</div>
    <div id="speechBubble"></div>
    <button id="mobileToggle">☰ 創作工具</button>
    <div id="startScreen">
      <div class="intro">
        <h1>Mindspace<br>心智小宇宙</h1>
        <p>捏出你的小生命，讓牠活起來。<br>說出你的想像，讓故事自己展開。</p>
        <button id="startButton">✨ 開始冒險</button>
      </div>
    </div>
  </main>

  <aside id="sidebar">
    <header>
      <h2>🌈 心智小宇宙</h2>
      <p class="small">給予方法，但不給予答案。</p>
    </header>

    <section class="panel stack">
      <h3>① 創造黏土生命</h3>
      <div class="row">
        <button class="primary" id="openCamera">📷 開啟攝影機</button>
        <button id="uploadPhoto">上傳照片</button>
      </div>
      <input type="file" id="photoFile" accept="image/*" hidden>
      <div id="heroList"></div>
      <select id="selectedHero"><option value="">請先新增角色</option></select>
      <div class="row">
        <button id="editHero">修改照片</button>
        <button id="inspectHero">AI 看外觀</button>
        <button class="danger" id="deleteHero">刪除角色</button>
      </div>
      <div class="small" id="appearance"></div>
    </section>

    <section class="panel stack">
      <h3>② 和生命一起說故事</h3>
      <div id="chatLog"></div>
      <textarea id="chatInput" placeholder="例如：泡泡，你的眼睛可以發射雷射嗎？"></textarea>
      <div class="row">
        <button id="micButton">🎤 說話</button>
        <button class="primary" id="sendButton">送出想像</button>
      </div>
      <div class="row">
        <button id="voiceButton">🔊 自然語音：開</button>
        <button id="stopVoice">停止說話</button>
      </div>
      <p class="small">角色聲音由 AI 生成，並非真人錄音。</p>
    </section>

    <section class="panel stack">
      <h3>③ 讓角色變得不一樣</h3>
      <textarea id="transformInput" placeholder="例如：幫我的黏土魚長出兩隻紫色翅膀"></textarea>
      <div class="row">
        <button class="primary" id="transformButton">✨ AI 黏土變身</button>
        <button id="restoreButton">還原造型</button>
      </div>
      <div class="row">
        <button id="showTransform">切換造型</button>
        <button id="skillButton">施展技能</button>
      </div>
    </section>

    <section class="panel stack">
      <h3>④ 探索世界</h3>
      <select id="worldSelect">
        <option value="ocean">🌊 海底世界</option>
        <option value="forest">🌳 奇幻森林</option>
        <option value="space">🌌 太空世界</option>
      </select>
      <button id="resetButton">重新開始冒險</button>
      <div id="status">準備開始創造！</div>
    </section>
  </aside>
</div>

<div class="modal" id="cameraModal">
  <div class="modal-content">
    <div class="modal-head"><h2>📷 拍攝黏土角色</h2><button id="closeCamera">關閉</button></div>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <p id="cameraMessage" class="small">將黏土角色放在光線充足、背景單純的位置。</p>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="captureButton">拍照</button>
      <button id="switchCamera">切換鏡頭</button>
      <button id="retryCamera">重新開啟</button>
    </div>
  </div>
</div>

<div class="modal" id="editorModal">
  <div class="modal-content">
    <div class="modal-head"><h2>🎨 黏土角色修圖</h2><button id="closeEditor">關閉</button></div>
    <canvas id="editCanvas"></canvas>
    <div id="editorStatus">先選擇 AI 智慧去背，或使用手動工具。</div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="aiRemoveBg">✨ AI 智慧去背</button>
      <button id="removeBg">快速去背</button>
      <button id="restoreOriginalPhoto">還原原照片</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="eraseMode">橡皮擦</button>
      <button id="restoreMode">恢復筆刷</button>
      <button id="undoEdit">上一步</button>
    </div>
    <label class="small">筆刷大小
      <input type="range" id="brushSize" min="5" max="100" value="25">
    </label>
    <div class="row">
      <button class="primary" id="saveEditor">儲存黏土角色</button>
    </div>
  </div>
</div>

<iframe id="bridgeFrame" title="AI bridge"></iframe>
<script src="./sketch.js"></script>
</body>
</html>
